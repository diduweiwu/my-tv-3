name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag without v prefix (e.g. 2.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > app/keystore.properties << EOF
          storeFile=/home/runner/.android/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Build release APKs
        run: ./gradlew assembleRelease

      # --- 修改点 1：查找所有 APK ---
      - name: Find all APKs
        id: find_apks
        run: |
          # 使用 find 命令查找所有 .apk 文件
          # 使用 tr '\n' ',' 将换行符替换为逗号，因为 softprops 插件支持逗号分隔的文件列表
          APKS=$(find app/build/outputs/apk/release -name '*.apk' -type f | tr '\n' ',')
          
          if [ -z "$APKS" ]; then
            echo "ERROR: No APKs found!" >&2
            exit 1
          fi
          
          # 输出结果，去掉末尾可能多余的逗号
          echo "apk_paths=${APKS%,}" >> "$GITHUB_OUTPUT"
          echo "Found APKs:"
          echo "$APKS"

      - name: Get changelog
        id: get_changelog
        run: |
          chmod +x history.sh
          output=$(./history.sh)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Get version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "ref_name=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "ref_name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # --- 修改点 2：上传所有 APK ---
      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: ${{ steps.get_changelog.outputs.changelog }}
          # 这里直接使用上一步生成的逗号分隔的路径列表
          files: ${{ steps.find_apks.outputs.apk_paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}