name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag without v prefix (e.g. 2.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > app/keystore.properties << EOF
          storeFile=/home/runner/.android/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Get version tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_TAG="v${{ github.event.inputs.version }}"
            CURRENT_VERSION="${{ github.event.inputs.version }}"
          else
            CURRENT_TAG="${{ github.ref_name }}"
            CURRENT_VERSION="${CURRENT_TAG#v}"
          fi

          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")

          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate Changelog
        id: changelog
        run: |
          CURRENT_TAG="${{ steps.tags.outputs.current_tag }}"
          PREVIOUS_TAG="${{ steps.tags.outputs.previous_tag }}"

          if [ -z "$PREVIOUS_TAG" ]; then
            # 如果是第一个 tag，获取所有提交记录
            COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # 获取两个 tag 之间的提交记录
            COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREVIOUS_TAG}..${CURRENT_TAG} --reverse)
          fi

          # 输出 changelog 用于 release body
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Rename APKs with version
        id: rename_apks
        run: |
          TAG="${{ steps.tags.outputs.current_tag }}"
          APK_DIR="app/build/outputs/apk/release"
          DEST_DIR="apks"
          mkdir -p $DEST_DIR

          for APK in $APK_DIR/*.apk; do
            BASENAME=$(basename "$APK" .apk)
            ARCH=$(echo "$BASENAME" | sed 's/.*-\(.*\)-release/\1/')

            if [ "$ARCH" = "universal" ]; then
              NEW_NAME="my-tv-3-${TAG}-universal.apk"
            else
              NEW_NAME="my-tv-3-${TAG}-${ARCH}.apk"
            fi

            cp "$APK" "$DEST_DIR/$NEW_NAME"
            echo "Renamed: $NEW_NAME"
          done

          echo "apk_dir=$DEST_DIR" >> "$GITHUB_OUTPUT"
          ls -la $DEST_DIR/

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tags.outputs.current_tag }}
          name: Release ${{ steps.tags.outputs.current_tag }}
          body: |
            ## 更新日志
            ${{ steps.changelog.outputs.changelog }}
          files: ${{ steps.rename_apks.outputs.apk_dir }}/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}