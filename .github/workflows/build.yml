name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag without v prefix (e.g. 2.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > app/keystore.properties << EOF
          storeFile=/home/runner/.android/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEYSTORE_PASSWORD }}
          EOF

      - name: Get version tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CURRENT_TAG="v${{ github.event.inputs.version }}"
            CURRENT_VERSION="${{ github.event.inputs.version }}"
          else
            CURRENT_TAG="${{ github.ref_name }}"
            CURRENT_VERSION="${CURRENT_TAG#v}"
          fi

          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
          PREVIOUS_VERSION="${PREVIOUS_TAG#v}"

          echo "current_tag=$CURRENT_TAG" >> "$GITHUB_OUTPUT"
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_version=$PREVIOUS_VERSION" >> "$GITHUB_OUTPUT"

      - name: Get changelog
        id: get_changelog
        run: |
          chmod +x history.sh
          output=$(./history.sh "${{ steps.tags.outputs.current_version }}" "${{ steps.tags.outputs.previous_version }}")
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Find all APKs
        id: find_apks
        run: |
          APKS=$(find app/build/outputs/apk/release -name '*.apk' -type f | tr '\n' ',')
          
          if [ -z "$APKS" ]; then
            echo "ERROR: No APKs found!" >&2
            exit 1
          fi
          
          echo "apk_paths=${APKS%,}" >> "$GITHUB_OUTPUT"
          echo "Found APKs:"
          echo "$APKS"

      - name: Create Release and Upload APKs
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tags.outputs.current_tag }}
          name: Release ${{ steps.tags.outputs.current_tag }}
          body: ${{ steps.get_changelog.outputs.changelog }}
          files: ${{ steps.find_apks.outputs.apk_paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
