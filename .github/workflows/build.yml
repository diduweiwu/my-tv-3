name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > ~/.android/release.keystore

      - name: Write keystore.properties
        run: |
          cat > keystore.properties << EOF
          storeFile=/home/runner/.android/release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.ALIAS_PASSWORD }}
          EOF

      - name: Build release APKs
        run: ./gradlew assembleRelease

      - name: Find universal APK
        id: find_apk
        run: |
          APK=$(find app/build/outputs/apk/release -name '*universal.apk' -type f | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERROR: No universal APK found!" >&2
            exit 1
          fi
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "Universal APK found: $APK"

      - name: Get changelog
        id: get_changelog
        run: |
          chmod +x history.sh
          output=$(./history.sh)
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$output" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ steps.get_changelog.outputs.changelog }}
          files: ${{ steps.find_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}